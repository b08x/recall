[project]
name = "recall"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Robert Pannick", email = "rwpannick@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.8",
    "dspy-ai>=3.1.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tenacity>=9.0.0",
]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
